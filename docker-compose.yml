# Kronos + Fraud Shield, all in one:  docker compose up --build
#   frontend      http://localhost:5173
#   backend       http://localhost:8080   (REST + /ws)
#   risk service  http://localhost:8000   (FastAPI, /docs)
#   postgres      localhost:5433
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kronos
      POSTGRES_PASSWORD: kronos
      POSTGRES_DB: kronos
    ports: ["5433:5432"]
    volumes:
      - ./backend/internal/db/schema_enhanced.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/internal/db/procedures.sql:/docker-entrypoint-initdb.d/02_procedures.sql:ro
      - ./backend/internal/db/views.sql:/docker-entrypoint-initdb.d/03_views.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kronos -d kronos"]
      interval: 3s
      retries: 20

  risk:
    build: ./ml
    environment:
      DATABASE_URL: postgresql://kronos:kronos@postgres:5432/kronos
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://kronos:kronos@postgres:5432/kronos?sslmode=disable
      JWT_SECRET: change-me-in-production
      RISK_SERVICE_URL: http://risk:8000
      RISK_TIMEOUT: 300ms
      ADMIN_USERNAMES: analyst
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      risk: {condition: service_started}

  frontend:
    build:
      context: ./kronos
      args:
        VITE_API_URL: http://localhost:8080
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  pgdata:
